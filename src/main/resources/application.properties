spring.web.error.include-message=always
#spring.web.error.include-binding-errors=always
spring.application.name=hr
spring.profiles.default=dev
server.port=8081

# Default timeout for asynchronous HTTP requests (for example: 30s, 1m)
app.request.timeout=${REQUEST_TIMEOUT:30s}

# Shared HikariCP connection pool configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
